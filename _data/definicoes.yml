- id: ue-autoridade-de-controlo-interessada
  titulo: Autoridade de controlo interessada
  termos:
  - Autoridade de controlo interessada
  busca:
  - Autoridade de controlo interessada
  letra: A
  tema: Crianças, adolescentes e idade
  jurisdicao: UE
  definicoes:
  - termo: Autoridade de controlo interessada
    texto: 'uma autoridade de controlo afetada pelo tratamento de dados pessoais pelo facto de:


      - a) O responsável pelo tratamento ou o subcontratante estar estabelecido no território do Estado-Membro dessa autoridade de controlo;


      - b) Os titulares de dados que residem no Estado-Membro dessa autoridade de controlo serem substancialmente afetados, ou suscetíveis de o ser, pelo tratamento dos dados; ou


      - c) Ter sido apresentada uma reclamação junto dessa autoridade de controlo;'
    jurisdicao: UE
    norma: gdpr
    norma_apelido: General Data Protection Regulation (GDPR) da UE
    norma_titulo: Regulamento (UE) 2016/679, de 27 de abril de 2016
