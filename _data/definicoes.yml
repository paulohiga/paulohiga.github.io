- id: br-praticas-manipulativas-enganosas-ou-coercitivas
  titulo: práticas manipulativas, enganosas ou coercitivas
  termos:
  - práticas manipulativas, enganosas ou coercitivas
  busca:
  - práticas manipulativas, enganosas ou coercitivas
  letra: P
  tema: Outros conceitos normativos
  jurisdicao: BR
  definicoes:
  - termo: práticas manipulativas, enganosas ou coercitivas
    texto: 'quaisquer arquiteturas de escolha, fluxos de interação ou funcionalidades que tenham por objetivo ou efeito empregar táticas que interfiram na autonomia decisória do usuário ou que explorem as suas vulnerabilidades, em particular as cognitivas e etárias, incluídas, entre outras, as práticas de:


      I - obstrução, ao dificultar ou impedir o fluxo de tarefas do usuário, de modo a dissuadi-lo de realizar determinada ação, inclusive a interrupção do uso, o cancelamento de serviços ou a modificação de preferências, por meio de caminhos excessivamente complexos, confusos ou desproporcionais;


      II - exploração de vulnerabilidades cognitivas, ao utilizar pressões emocionais, urgências fabricadas, escolhas enviesadas, inferências emocionais ou estímulos inadequados à idade para induzir decisões contrárias ao melhor interesse da criança ou do adolescente; ou


      III - prejuízo ao exercício de direitos, ao ocultar, fragmentar ou dificultar o acesso a controles de privacidade, supervisão parental, consentimento ou revogação de permissões.'
    jurisdicao: BR
    norma: decreto-12880
    norma_apelido: Dec. nº 12.880/2026 — Regulamento do ECA Digital
    norma_titulo: Decreto nº 12.880, de 18 de março de 2026
    fonte: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2026/decreto/D12880.htm
    dispositivo: art. 10, parágrafo único
    url: /notas/eca-digital#dec12880-art-10-pu
