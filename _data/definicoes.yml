- id: br-acesso-provavel-por-criancas-e-adolescentes
  titulo: Acesso provável por crianças e adolescentes
  termos:
  - Acesso provável por crianças e adolescentes
  busca:
  - Acesso provável por crianças e adolescentes
  busca_texto: Acesso provável por crianças e adolescentes Crianças, adolescentes e idade ECA Digital Lei nº 15.211, de 17 de setembro de 2025
  letra: A
  tema: Crianças, adolescentes e idade
  jurisdicao: BR
  definicoes:
  - texto: 'as seguintes situações:


      I – suficiente probabilidade de uso e atratividade do produto ou serviço de tecnologia da informação por crianças e adolescentes;


      II – considerável facilidade ao acesso e utilização do produto ou serviço de tecnologia da informação por crianças e adolescentes; e


      III – significativo grau de risco à privacidade, à segurança ou ao desenvolvimento biopsicossocial de crianças e de adolescentes, especialmente no caso de produtos ou serviços que tenham por finalidade permitir a interação social e o compartilhamento de informações em larga escala entre usuários em ambiente digital'
    referencias:
    - jurisdicao: BR
      norma: eca-digital
      norma_apelido: ECA Digital
      norma_titulo: Lei nº 15.211, de 17 de setembro de 2025
      fonte: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm
      dispositivo: art. 1º, parágrafo único
      url: /notas/eca-digital#art-1-pu
      nota_url: /notas/eca-digital
