- termo: Resolução
  slug: resolucao
  tema: rito
  bases:
  - texto: art. 51, I
    ancora: art-51-i
  definicao: expressa decisão quanto ao provimento normativo de competência da ANPD
- termo: Enunciado
  slug: enunciado
  tema: rito
  bases:
  - texto: art. 51, II
    ancora: art-51-ii
  definicao: expressa decisão quanto à interpretação da legislação de proteção de
    dados pessoais e fixa entendimento sobre matérias de competência da ANPD, com
    efeito vinculativo à Autoridade
- termo: Despacho Decisório
  slug: despacho-decisorio
  tema: rito
  bases:
  - texto: art. 51, III
    ancora: art-51-iii
  definicao: expressa decisão sobre matérias não abrangidas pelos demais instrumentos
    deliberativos previstos neste artigo
- termo: Ata de Deliberação
  slug: ata-de-deliberacao
  tema: rito
  bases:
  - texto: art. 51, IV
    ancora: art-51-iv
  definicao: registra as deliberações tomadas pelo Conselho Diretor, a partir dos
    votos de seus Diretores, em Reuniões e Circuitos Deliberativos
- termo: Consulta Pública
  slug: consulta-publica
  tema: rito
  bases:
  - texto: art. 51, V
    ancora: art-51-v
  definicao: expressa decisão que submete proposta de ato normativo, documento ou
    assunto a críticas e sugestões do público em geral
- termo: Portaria
  slug: portaria
  tema: rito
  bases:
  - texto: art. 51, VI
    ancora: art-51-vi
  definicao: é o ato administrativo que dispõe sobre matéria relativa à gestão administrativa
    e ao funcionamento das unidades da ANPD
- termo: Circuito Deliberativo
  slug: circuito-deliberativo
  tema: rito
  bases:
  - texto: art. 40
    ancora: art-40
  aliases:
  - Circuitos Deliberativos
  definicao: o procedimento decisório do Conselho Diretor caracterizado pela coleta
    de votos, em meio eletrônico, sem a necessidade da realização de Reunião Deliberativa.
