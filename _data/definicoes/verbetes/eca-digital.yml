- termo: Produto ou serviço de tecnologia da informação
  slug: produto-ou-servico-de-ti
  tema: rede
  bases:
  - texto: art. 2º, I
    ancora: art-2-i
  aliases:
  - produtos e serviços de tecnologia da informação
  definicao: produto ou serviço fornecido a distância, por meio eletrônico e provido
    em virtude de requisição individual, tais como aplicações de internet, programas
    de computador, *software*s, sistemas operacionais de terminais, lojas de aplicações
    de internet e jogos eletrônicos ou similares conectados à internet ou a outra
    rede de comunicações
- termo: Produto ou serviço de monitoramento infantil
  slug: produto-ou-servico-de-monitoramento-infantil
  tema: infancia
  bases:
  - texto: art. 2º, II
    ancora: art-2-ii
  aliases:
  - produtos de monitoramento infantil
  - monitoramento infantil
  definicao: produto ou serviço de tecnologia da informação destinado ao acompanhamento,
    por pais ou responsáveis legais, das ações executadas por crianças e adolescentes
    em ambientes digitais, a partir do registro ou da transmissão de imagens, de
    sons, de informações de localização, de atividade ou de outros dados
- termo: Rede social
  slug: rede-social
  tema: rede
  bases:
  - texto: art. 2º, III
    ancora: art-2-iii
  aliases:
  - redes sociais
  definicao: aplicação de internet que tem como principal finalidade o compartilhamento
    e a disseminação, pelos usuários, de opiniões e informações veiculadas por textos
    ou arquivos de imagens, sonoros ou audiovisuais, em uma única plataforma, por
    meio de contas conectadas ou acessíveis de forma articulada, permitida a conexão
    entre usuários
  nota: 'É a única definição legal de rede social no direito brasileiro de internet:
    o Marco Civil não a tem — as que seriam os incisos IX e X do art. 5º dele só
    existiram na redação da MPV nº 1.068/2021, rejeitada.'
- termo: Caixa de recompensa
  slug: caixa-de-recompensa
  tema: infancia
  bases:
  - texto: art. 2º, IV
    ancora: art-2-iv
  aliases:
  - caixas de recompensa
  definicao: funcionalidade disponível em certos jogos eletrônicos que permite a
    aquisição, mediante pagamento, pelo jogador, de itens virtuais consumíveis ou
    de vantagens aleatórias, resgatáveis pelo jogador ou usuário, sem conhecimento
    prévio de seu conteúdo ou garantia de sua efetiva utilidade
- termo: Perfilamento
  slug: perfilamento
  grupo: perfilamento
  tema: operacoes
  bases:
  - texto: art. 2º, V
    ancora: art-2-v
  definicao: qualquer forma de tratamento de dados pessoais, automatizada ou não,
    para avaliar certos aspectos de uma pessoa natural, com o objetivo de classificá-la
    em grupo ou perfil de modo a fazer inferências sobre seu comportamento, situação
    econômica, saúde, preferências pessoais, interesses, desejos de consumo, localização
    geográfica, deslocamentos, posições políticas ou outras características assemelhadas
- termo: Loja de aplicações de internet
  slug: loja-de-aplicacoes
  tema: rede
  bases:
  - texto: art. 2º, VI
    ancora: art-2-vi
  aliases:
  - lojas de aplicações
  - loja de aplicações
  definicao: aplicação de internet que distribui e facilita o *download*, para usuários
    de terminais, de aplicações de internet disponibilizadas ou tornadas acessíveis
    por meio de sua plataforma
- termo: Sistema operacional
  slug: sistema-operacional
  tema: rede
  bases:
  - texto: art. 2º, VII
    ancora: art-2-vii
  aliases:
  - sistemas operacionais
  definicao: '*software* de sistema que controla as funções básicas de um *hardware*
    ou *software* e permite que aplicações de internet, programas de computador,
    aplicativos ou outros *software*s sejam executados por meio dele'
- termo: Mecanismo de supervisão parental
  slug: mecanismo-de-supervisao-parental
  tema: infancia
  bases:
  - texto: art. 2º, VIII
    ancora: art-2-viii
  aliases:
  - mecanismos de supervisão parental
  - supervisão parental
  definicao: conjunto de configurações, de ferramentas e de salvaguardas tecnológicas
    integradas a produtos ou serviços de tecnologia da informação direcionados a
    crianças e a adolescentes ou de acesso provável por eles que possibilitem aos
    pais ou responsáveis legais supervisionar, limitar e gerenciar o uso do serviço,
    o conteúdo acessado e o tratamento de dados pessoais realizado
- termo: Serviço com controle editorial
  slug: servico-com-controle-editorial
  tema: rede
  bases:
  - texto: art. 2º, IX
    ancora: art-2-ix
  aliases:
  - serviços com controle editorial
  definicao: aplicação de internet que tem como finalidade principal a disponibilização
    de conteúdos previamente selecionados, sem o uso de meios automatizados de seleção,
    por agente econômico responsável
- termo: Autoridade administrativa autônoma de proteção dos direitos de crianças
    e de adolescentes no ambiente digital
  slug: autoridade-administrativa-autonoma
  tema: sujeitos
  bases:
  - texto: art. 2º, X
    ancora: art-2-x
  aliases:
  - autoridade administrativa autônoma
  definicao: entidade da administração pública criada por lei, responsável por zelar
    pela aplicação desta Lei e fiscalizar o seu cumprimento em todo o território
    nacional e por editar regulamentos e procedimentos para sua execução, a qual
    deve observar no processo decisório as normas previstas no Capítulo I da Lei
    nº 13.848, de 25 de junho de 2019
  nota: Papel atribuído à **ANPD** pelo Decreto nº 12.622/2025.
- termo: Monetização
  slug: monetizacao
  tema: conteudo
  bases:
  - texto: art. 2º, XI
    ancora: art-2-xi
  definicao: remuneração direta ou indireta de usuário de aplicação de internet
    pela publicação, pela postagem, pela exibição, pela disponibilização, pela transmissão,
    pela divulgação ou pela distribuição de conteúdo, incluída receita por visualizações,
    assinaturas, doações, patrocínios, publicidade ou venda de produtos e serviços
    vinculados
- termo: Impulsionamento
  slug: impulsionamento
  tema: conteudo
  bases:
  - texto: art. 2º, XII
    ancora: art-2-xii
  definicao: ampliação artificial do alcance, da visibilidade ou da priorização
    de conteúdo mediante pagamento pecuniário ou valor estimável em dinheiro
- termo: Criança e adolescente
  slug: crianca-e-adolescente
  tema: infancia
  bases:
  - texto: art. 2º, § 1º
    ancora: art-2-p1
  aliases:
  - crianças e adolescentes
  definicao: Aplicam-se a esta Lei os conceitos de criança e de adolescente constantes
    do art. 2º da Lei nº 8.069, de 13 de julho de 1990 (Estatuto da Criança e do
    Adolescente), e os de internet, de aplicações de internet e de terminal constantes
    do art. 5º da Lei nº 12.965, de 23 de abril de 2014 (Marco Civil da Internet).
  nota: 'O ECA Digital não redefine os termos: manda aplicar os do [ECA](https://www.planalto.gov.br/ccivil_03/leis/l8069.htm)
    — criança até 12 anos incompletos, adolescente dos 12 aos 18 — e os do [art.
    5º do Marco Civil da Internet](/notas/mci#art-5).'
