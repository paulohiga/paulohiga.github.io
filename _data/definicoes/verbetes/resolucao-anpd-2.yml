- termo: Agentes de tratamento de pequeno porte
  slug: agentes-de-tratamento-de-pequeno-porte
  tema: sujeitos
  bases:
  - texto: art. 2, I
    ancora: art-2-i
  definicao: microempresas, empresas de pequeno porte, startups, pessoas jurídicas
    de direito privado, inclusive sem fins lucrativos, nos termos da legislação
    vigente, bem como pessoas naturais e entes privados despersonalizados que realizam
    tratamento de dados pessoais, assumindo obrigações típicas de controlador ou
    de operador
- termo: Microempresas e empresas de pequeno porte
  slug: microempresas-e-empresas-de-pequeno-porte
  tema: sujeitos
  bases:
  - texto: art. 2, II
    ancora: art-2-ii
  definicao: sociedade empresária, sociedade simples, sociedade limitada unipessoal,
    nos termos do art. 41 da Lei nº 14.195, de 26 de agosto de 2021, e o empresário
    a que se refere o art. 966 da Lei nº 10.406, de 10 de janeiro de 2002 (Código
    Civil), incluído o microempreendedor individual, devidamente registrados no
    Registro de Empresas Mercantis ou no Registro Civil de Pessoas Jurídicas, que
    se enquadre nos termos do art. 3º e 18-A, § 1º da Lei Complementar nº 123, de
    14 de dezembro de 2006
- termo: Startups
  slug: startups
  tema: sujeitos
  bases:
  - texto: art. 2, III
    ancora: art-2-iii
  definicao: organizações empresariais ou societárias, nascentes ou em operação
    recente, cuja atuação caracteriza-se pela inovação aplicada a modelo de negócios
    ou a produtos ou serviços ofertados, que atendam aos critérios previstos no
    Capítulo II da Lei Complementar nº 182, de 1º de junho de 2021
- termo: Zonas acessíveis ao público
  slug: zonas-acessiveis-ao-publico
  tema: governanca
  bases:
  - texto: art. 2, IV
    ancora: art-2-iv
  definicao: espaços abertos ao público, como praças, centros comerciais, vias públicas,
    estações de ônibus, de metrô e de trem, aeroportos, portos, bibliotecas públicas,
    dentre outros
