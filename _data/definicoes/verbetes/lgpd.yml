- termo: Dado pessoal
  slug: dado-pessoal
  grupo: dado-pessoal
  tema: dados
  bases:
  - texto: art. 5º, I
    ancora: art-5-i
  aliases:
  - dados pessoais
  definicao: informação relacionada a pessoa natural identificada ou identificável
  nota: '**"Identificável" puxa muita coisa para dentro da lei.** Não é preciso
    ter o

    nome: basta que a informação, sozinha ou combinada com outras, permita

    chegar a uma pessoa.


    **Perfil comportamental pode ser dado pessoal.** Dados usados para formar o

    perfil de comportamento de uma pessoa determinada, se ela estiver

    identificada, contam como dados pessoais ([art. 12, § 2º](#art-12-p2)).

    '
- termo: Dado pessoal sensível
  slug: dado-pessoal-sensivel
  tema: dados
  bases:
  - texto: art. 5º, II
    ancora: art-5-ii
  aliases:
  - dados pessoais sensíveis
  - dados sensíveis
  - dado sensível
  definicao: dado pessoal sobre origem racial ou étnica, convicção religiosa, opinião
    política, filiação a sindicato ou a organização de caráter religioso, filosófico
    ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico,
    quando vinculado a uma pessoa natural
  nota: A etiqueta segue o que o dado **revela**. A regra alcança qualquer tratamento
    que revele dado sensível e possa causar dano ao titular ([art. 11, § 1º](#art-11-p1))
    — a foto do rosto usada para reconhecimento facial é dado biométrico; a lista
    de presença de um culto revela convicção religiosa.
- termo: Dado anonimizado
  slug: dado-anonimizado
  tema: dados
  bases:
  - texto: art. 5º, III
    ancora: art-5-iii
  aliases:
  - dados anonimizados
  - anonimizados
  - anonimizado
  definicao: dado relativo a titular que não possa ser identificado, considerando
    a utilização de meios técnicos razoáveis e disponíveis na ocasião de seu tratamento
  nota: '**Dado anonimizado não é considerado dado pessoal**, salvo quando o processo
    de anonimização for revertido utilizando exclusivamente meios próprios, ou quando,
    com esforços razoáveis, puder ser revertido ([art. 12](#art-12)). O que é "razoável"
    leva em conta custo e tempo da reversão, diante das tecnologias disponíveis
    ([art. 12, § 1º](#art-12-p1)). A ANPD pode, ouvido o CNPD, dispor sobre padrões
    e técnicas de anonimização e verificar sua segurança ([art. 12, § 3º](#art-12-p3)).'
- termo: Banco de dados
  slug: banco-de-dados
  tema: dados
  bases:
  - texto: art. 5º, IV
    ancora: art-5-iv
  aliases:
  - bancos de dados
  definicao: conjunto estruturado de dados pessoais, estabelecido em um ou em vários
    locais, em suporte eletrônico ou físico
- termo: Titular
  slug: titular
  tema: sujeitos
  bases:
  - texto: art. 5º, V
    ancora: art-5-v
  aliases:
  - titulares
  definicao: pessoa natural a quem se referem os dados pessoais que são objeto de
    tratamento
- termo: Controlador
  slug: controlador
  tema: sujeitos
  bases:
  - texto: art. 5º, VI
    ancora: art-5-vi
  aliases:
  - controladores
  definicao: pessoa natural ou jurídica, de direito público ou privado, a quem competem
    as decisões referentes ao tratamento de dados pessoais
  nota: 'A distinção **controlador × operador** é a que mais decide caso concreto,
    e o rótulo escrito no contrato não resolve: quem decide *por que* e *como* os
    dados são tratados é controlador, ainda que terceirize a execução inteira. A
    empresa que contrata um serviço de folha de pagamento é controladora; a empresa
    de folha é operadora — até o dia em que resolver usar aqueles dados para uma
    finalidade própria, quando vira controladora daquele tratamento e responde como
    tal ([art. 42, § 1º, I](#art-42-p1-i)).'
- termo: Operador
  slug: operador
  grupo: operador
  tema: sujeitos
  bases:
  - texto: art. 5º, VII
    ancora: art-5-vii
  aliases:
  - operadores
  definicao: pessoa natural ou jurídica, de direito público ou privado, que realiza
    o tratamento de dados pessoais em nome do controlador
- termo: Encarregado
  slug: encarregado
  tema: sujeitos
  bases:
  - texto: art. 5º, VIII
    ancora: art-5-viii
  definicao: pessoa indicada pelo controlador e operador para atuar como canal de
    comunicação entre o controlador, os titulares dos dados e a Agência Nacional
    de Proteção de Dados (ANPD); _(Redação dada pela Lei nº 15.352, de 2026)_
- termo: Agentes de tratamento
  slug: agentes-de-tratamento
  tema: sujeitos
  bases:
  - texto: art. 5º, IX
    ancora: art-5-ix
  aliases:
  - agente de tratamento
  definicao: o controlador e o operador
- termo: Tratamento
  slug: tratamento
  grupo: tratamento
  tema: operacoes
  bases:
  - texto: art. 5º, X
    ancora: art-5-x
  definicao: toda operação realizada com dados pessoais, como as que se referem
    a coleta, produção, recepção, classificação, utilização, acesso, reprodução,
    transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação,
    avaliação ou controle da informação, modificação, comunicação, transferência,
    difusão ou extração
  nota: 'O conceito é propositalmente amplo: a lista do inciso X é exemplificativa
    ("como as que se referem a"), e simplesmente *guardar* um dado, sem nunca abrir
    o arquivo, já é tratamento — armazenamento está lá. Não existe base de dados
    "parada" fora do alcance da lei.'
- termo: Anonimização
  slug: anonimizacao
  tema: operacoes
  bases:
  - texto: art. 5º, XI
    ancora: art-5-xi
  aliases:
  - anonimizar
  definicao: utilização de meios técnicos razoáveis e disponíveis no momento do
    tratamento, por meio dos quais um dado perde a possibilidade de associação,
    direta ou indireta, a um indivíduo
- termo: Consentimento
  slug: consentimento
  grupo: consentimento
  tema: operacoes
  bases:
  - texto: art. 5º, XII
    ancora: art-5-xii
  definicao: manifestação livre, informada e inequívoca pela qual o titular concorda
    com o tratamento de seus dados pessoais para uma finalidade determinada
- termo: Bloqueio
  slug: bloqueio
  tema: operacoes
  bases:
  - texto: art. 5º, XIII
    ancora: art-5-xiii
  definicao: suspensão temporária de qualquer operação de tratamento, mediante guarda
    do dado pessoal ou do banco de dados
- termo: Eliminação
  slug: eliminacao
  tema: operacoes
  bases:
  - texto: art. 5º, XIV
    ancora: art-5-xiv
  definicao: exclusão de dado ou de conjunto de dados armazenados em banco de dados,
    independentemente do procedimento empregado
- termo: Transferência internacional de dados
  slug: transferencia-internacional
  tema: transferencia
  bases:
  - texto: art. 5º, XV
    ancora: art-5-xv
  definicao: transferência de dados pessoais para país estrangeiro ou organismo
    internacional do qual o país seja membro
- termo: Uso compartilhado de dados
  slug: uso-compartilhado
  tema: operacoes
  bases:
  - texto: art. 5º, XVI
    ancora: art-5-xvi
  aliases:
  - uso compartilhado
  definicao: comunicação, difusão, transferência internacional, interconexão de
    dados pessoais ou tratamento compartilhado de bancos de dados pessoais por órgãos
    e entidades públicos no cumprimento de suas competências legais, ou entre esses
    e entes privados, reciprocamente, com autorização específica, para uma ou mais
    modalidades de tratamento permitidas por esses entes públicos, ou entre entes
    privados
- termo: Relatório de impacto à proteção de dados pessoais
  slug: ripd
  tema: governanca
  bases:
  - texto: art. 5º, XVII
    ancora: art-5-xvii
  aliases:
  - RIPD
  - relatório de impacto
  definicao: documentação do controlador que contém a descrição dos processos de
    tratamento de dados pessoais que podem gerar riscos às liberdades civis e aos
    direitos fundamentais, bem como medidas, salvaguardas e mecanismos de mitigação
    de risco
- termo: Órgão de pesquisa
  slug: orgao-de-pesquisa
  tema: sujeitos
  bases:
  - texto: art. 5º, XVIII
    ancora: art-5-xviii
  aliases:
  - órgãos de pesquisa
  definicao: órgão ou entidade da administração pública direta ou indireta ou pessoa
    jurídica de direito privado sem fins lucrativos legalmente constituída sob as
    leis brasileiras, com sede e foro no País, que inclua em sua missão institucional
    ou em seu objetivo social ou estatutário a pesquisa básica ou aplicada de caráter
    histórico, científico, tecnológico ou estatístico; e _(Redação dada pela Lei
    nº 13.853, de 2019)_
- termo: Autoridade nacional
  slug: autoridade-nacional
  tema: sujeitos
  bases:
  - texto: art. 5º, XIX
    ancora: art-5-xix
  definicao: entidade da administração pública responsável por zelar, implementar
    e fiscalizar o cumprimento desta Lei em todo o território nacional. _(Redação
    dada pela Lei nº 15.352, de 2026)_
- termo: Pseudonimização
  slug: pseudonimizacao
  grupo: pseudonimizacao
  tema: operacoes
  bases:
  - texto: art. 13, § 4º
    ancora: art-13-p4
  aliases:
  - pseudonimizar
  - pseudonimizado
  - dado pseudonimizado
  definicao: o tratamento por meio do qual um dado perde a possibilidade de associação,
    direta ou indireta, a um indivíduo, senão pelo uso de informação adicional mantida
    separadamente pelo controlador em ambiente controlado e seguro.
  nota: 'A definição é dada "para os efeitos deste artigo" — o dos estudos em saúde
    pública por órgãos de pesquisa. **Pseudonimizar não é anonimizar**: como a chave
    existe, o dado pseudonimizado continua sendo dado pessoal, e a técnica opera
    como medida de segurança. Só o dado verdadeiramente anonimizado sai do alcance
    da lei ([art. 12](#art-12)), e sai **enquanto** a anonimização resistir.'
