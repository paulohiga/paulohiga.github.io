- termo: Internet
  slug: internet
  tema: rede
  bases:
  - texto: art. 5º, I
    ancora: art-5-i
  definicao: o sistema constituído do conjunto de protocolos lógicos, estruturado
    em escala mundial para uso público e irrestrito, com a finalidade de possibilitar
    a comunicação de dados entre terminais por meio de diferentes redes
- termo: Terminal
  slug: terminal
  tema: rede
  bases:
  - texto: art. 5º, II
    ancora: art-5-ii
  aliases:
  - terminais
  definicao: o computador ou qualquer dispositivo que se conecte à internet
- termo: Endereço de protocolo de internet (endereço IP)
  slug: endereco-ip
  tema: rede
  bases:
  - texto: art. 5º, III
    ancora: art-5-iii
  aliases:
  - endereço IP
  - endereços IP
  definicao: o código atribuído a um terminal de uma rede para permitir sua identificação,
    definido segundo parâmetros internacionais
- termo: Administrador de sistema autônomo
  slug: administrador-de-sistema-autonomo
  tema: rede
  bases:
  - texto: art. 5º, IV
    ancora: art-5-iv
  definicao: a pessoa física ou jurídica que administra blocos de endereço IP específicos
    e o respectivo sistema autônomo de roteamento, devidamente cadastrada no ente
    nacional responsável pelo registro e distribuição de endereços IP geograficamente
    referentes ao País
- termo: Conexão à internet
  slug: conexao-a-internet
  tema: rede
  bases:
  - texto: art. 5º, V
    ancora: art-5-v
  definicao: a habilitação de um terminal para envio e recebimento de pacotes de
    dados pela internet, mediante a atribuição ou autenticação de um endereço IP
- termo: Registro de conexão
  slug: registro-de-conexao
  tema: dados
  bases:
  - texto: art. 5º, VI
    ancora: art-5-vi
  aliases:
  - registros de conexão
  definicao: o conjunto de informações referentes à data e hora de início e término
    de uma conexão à internet, sua duração e o endereço IP utilizado pelo terminal
    para o envio e recebimento de pacotes de dados
- termo: Aplicações de internet
  slug: aplicacoes-de-internet
  tema: rede
  bases:
  - texto: art. 5º, VII
    ancora: art-5-vii
  aliases:
  - aplicação de internet
  definicao: o conjunto de funcionalidades que podem ser acessadas por meio de um
    terminal conectado à internet
- termo: Registros de acesso a aplicações de internet
  slug: registros-de-acesso-a-aplicacoes
  tema: dados
  bases:
  - texto: art. 5º, VIII
    ancora: art-5-viii
  aliases:
  - registros de acesso a aplicações
  - registros de acesso
  definicao: o conjunto de informações referentes à data e hora de uso de uma determinada
    aplicação de internet a partir de um determinado endereço IP
