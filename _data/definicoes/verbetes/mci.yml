# Definições do Marco Civil da Internet (Lei nº 12.965/2014), reunidas em
# /notas/definicoes. Campos e regras de escrita estão em "Definições legais"
# (docs/notas.md). Confira com `python3 scripts/conferir_definicoes.py mci`.

- termo: Internet
  slug: internet
  tema: rede
  bases: [{ texto: "art. 5º, I", ancora: art-5-i }]
  definicao: >-
    sistema constituído do conjunto de protocolos lógicos, estruturado em
    escala mundial para uso público e irrestrito, com a finalidade de
    possibilitar a comunicação de dados entre terminais por meio de diferentes
    redes.

- termo: Terminal
  slug: terminal
  tema: rede
  bases: [{ texto: "art. 5º, II", ancora: art-5-ii }]
  aliases: [terminais]
  definicao: o computador ou qualquer dispositivo que se conecte à internet.

- termo: Endereço de protocolo de internet (endereço IP)
  slug: endereco-ip
  tema: rede
  bases: [{ texto: "art. 5º, III", ancora: art-5-iii }]
  aliases: [endereço IP, endereços IP]
  definicao: >-
    código atribuído a um terminal de uma rede para permitir sua identificação,
    definido segundo parâmetros internacionais.

- termo: Administrador de sistema autônomo
  slug: administrador-de-sistema-autonomo
  tema: rede
  bases: [{ texto: "art. 5º, IV", ancora: art-5-iv }]
  definicao: >-
    pessoa física ou jurídica que administra blocos de endereço IP específicos
    e o respectivo sistema autônomo de roteamento, cadastrada no ente nacional
    responsável pelo registro e distribuição de endereços IP.

- termo: Conexão à internet
  slug: conexao-a-internet
  tema: rede
  bases: [{ texto: "art. 5º, V", ancora: art-5-v }]
  definicao: >-
    habilitação de um terminal para envio e recebimento de pacotes de dados
    pela internet, mediante atribuição ou autenticação de um endereço IP.

- termo: Registro de conexão
  slug: registro-de-conexao
  tema: dados
  bases: [{ texto: "art. 5º, VI", ancora: art-5-vi }]
  aliases: [registros de conexão]
  definicao: >-
    conjunto de informações referentes à data e hora de início e término de uma
    conexão, sua duração e o endereço IP utilizado.

- termo: Aplicações de internet
  slug: aplicacoes-de-internet
  tema: rede
  bases: [{ texto: "art. 5º, VII", ancora: art-5-vii }]
  aliases: [aplicação de internet]
  definicao: >-
    conjunto de funcionalidades que podem ser acessadas por meio de um terminal
    conectado à internet.

- termo: Registros de acesso a aplicações de internet
  slug: registros-de-acesso-a-aplicacoes
  tema: dados
  bases: [{ texto: "art. 5º, VIII", ancora: art-5-viii }]
  aliases: [registros de acesso a aplicações, registros de acesso]
  definicao: >-
    conjunto de informações referentes à data e hora de uso de uma aplicação a
    partir de um determinado endereço IP.
