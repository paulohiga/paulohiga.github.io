- termo: Conteúdo íntimo
  slug: conteudo-intimo
  tema: conteudo
  bases:
  - texto: art. 3, I
    ancora: art-3-i
  definicao: imagem, vídeo, áudio, mensagem de texto ou qualquer conteúdo por escrito,
    ou combinação destes, que exponha nudez, seminudez, ato sexual ou contexto sexualizante,
    ainda que produzido e manipulado, no todo ou em parte, por sistema de inteligência
    artificial ou recurso tecnológico equivalente
- termo: Violência contra mulheres em ambiente digital
  slug: violencia-contra-mulheres-em-ambiente-digital
  tema: conteudo
  bases:
  - texto: art. 3, II
    ancora: art-3-ii
  definicao: 'crimes ou atos ilícitos contra mulheres, em razão da condição do sexo
    feminino, consistente em ato, conduta ou omissão que cause morte, dano ou sofrimento
    físico, sexual, psicológico, político ou econômico, inclusive dano patrimonial,
    em qualquer esfera de suas vidas, cometido, instigado, facilitado ou agravado,
    total ou parcialmente, pelo uso de tecnologias digitais, tais como:


    a) violência doméstica e familiar contra a mulher, inclusive violência psicológica,
    nos termos do disposto no art. 7º, *caput*, inciso II, da Lei nº 11.340, de
    7 de agosto de 2006, praticada por meio de mensagem, publicação, perseguição
    digital, vigilância *on-line*, isolamento ou qualquer outra forma de controle
    tecnológico;


    b) violência política contra a mulher praticada em ambiente digital, nos termos
    do disposto no art. 326-B da Lei nº 4.737, de 15 de julho de 1965 – Código Eleitoral,
    que inclua assédio, constrangimento, humilhação, perseguição ou ameaça a candidatas
    ou titulares de mandato eletivo;


    c) ameaça qualificada contra a mulher em razão da condição do sexo feminino,
    nos termos do disposto no art. 147, § 1º, do Decreto-Lei nº 2.848, de 7 de dezembro
    de 1940 – Código Penal;


    d) perseguição da mulher realizada por meios digitais, nos termos do disposto
    no art. 147-A do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 – Código Penal,
    inclusive por monitoramento de redes sociais, envio reiterado de mensagens e
    uso de tecnologias de rastreamento;


    e) violência psicológica contra a mulher, nos termos do disposto no art. 147-B
    do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 – Código Penal, inclusive
    quando praticada mediante uso de inteligência artificial ou recurso tecnológico
    que altere imagem ou som da vítima;


    f) divulgação de cena de sexo, nudez ou ato libidinoso, sem consentimento, por
    meio da *internet*, nos termos do disposto no art. 218-C do Decreto-Lei nº 2.848,
    de 7 de dezembro de 1940 – Código Penal;


    g) registro não autorizado de cena de nudez ou ato sexual ou libidinoso de caráter
    íntimo e privado, nos termos do disposto no art. 216-B do Decreto-Lei nº 2.848,
    de 7 de dezembro de 1940 – Código Penal, inclusive mediante montagem ou uso
    de inteligência artificial;


    h) importunação sexual por meio digital, nos termos do disposto no art. 215-A
    do Decreto-Lei nº 2.848, de 7 de dezembro de 1940 – Código Penal; e


    i) crimes praticados por meio da *internet* que difundam conteúdo que propague
    ódio ou aversão às mulheres, nos termos do disposto no art. 1º, caput, inciso
    VII, da Lei nº 10.446, de 8 de maio de 2002.'
