# Ementas dos artigos do Regulamento (UE) 2025/2518 (regras processuais da
# cooperação do RGPD). Rótulo de navegação do sumário da lei seca, não texto
# legal — a regra de escrita está em "Ementas dos artigos" (docs/notas.md).
#
# A epígrafe oficial do artigo é mantida palavra por palavra sempre que cabe no
# rótulo; as compridas demais entram encurtadas, na mesma terminologia oficial
# em PT-PT do EUR-Lex. Nos arts. 29.º a 33.º a epígrafe oficial é a própria
# remissão ao RGPD, e é ela que fica: encurtar para o assunto perderia a única
# coisa que distingue um artigo do seguinte.

