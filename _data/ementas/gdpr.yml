# Ementas dos artigos do RGPD (Regulamento (UE) 2016/679).
# Rótulo de navegação do sumário da lei seca, não texto legal — a regra de
# escrita está em "Ementas dos artigos" (docs/notas.md).
#
# Num regulamento europeu o artigo já tem epígrafe oficial. Ela é mantida
# palavra por palavra sempre que cabe no rótulo; as compridas demais entram
# encurtadas, na mesma terminologia oficial em PT-PT do EUR-Lex ("controlo",
# "conceção", "subcontratante", "coimas") — o texto do painel continua sendo o
# do Jornal Oficial.

