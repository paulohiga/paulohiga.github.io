# Registro das normas disponíveis em /notas, usado por
# scripts/ancorar_referencias.py para reconhecer, nos comentários de
# `_notas/*.md`, menções a uma norma que já tem texto ancorado no site — e
# transformá-las em links para o dispositivo certo, sem gastar token de LLM
# nisso a cada nova norma ou edição.
#
# Cada entrada é uma norma da coleção `_leis` (chave = slug do arquivo em
# `_leis/`). Campos:
#   nota      — slug da nota (`_notas/<slug>.md`) cujo painel "Lei seca" exibe
#               essa norma. Se for a mesma nota sendo processada, o link vira
#               âncora na própria página (#...); se for outra nota, vira link
#               para a página dela (/notas/<nota>#...).
#   prefixo   — prefixo dos ids dessa norma no HTML (ver lei-anotada.html).
#               Vazio quando a norma é a principal (`lei:`) da nota indicada;
#               preenchido quando é uma norma extra (`normas_extra:`).
#               NÃO é o mesmo campo `prefixo` do front matter de `_leis/`:
#               aquele é o namespace da norma quando ela é exibida em qualquer
#               outra nota (o seletor do painel dá acesso a todas), e toda
#               norma tem o seu. Aqui interessa só como a norma aparece na nota
#               indicada em `nota:` — que é o alvo dos links gerados —, e lá a
#               principal continua sem prefixo. Esvaziar este campo por engano
#               quebraria os links já publicados.
#   aliases   — formas como a norma é citada em texto corrido. Ordem não
#               importa (o script ordena por tamanho antes de casar), mas
#               evite aliases ambíguos ou curtos demais (ex.: não cadastre só
#               "ECA" aqui — colidiria com menções à Lei nº 8.069, que não
#               tem nota própria).
#
# Ao publicar uma nota nova ou uma norma extra nova, adicione a entrada aqui.

