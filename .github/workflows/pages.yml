name: Deploy Jekyll site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

env:
  RUBY_VERSION: "3.3.12"
  BUNDLER_VERSION: "4.0.16"

# Garante um único deploy concorrente, sem cancelar um em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo: o jekyll-last-modified-at lê a data do último
          # commit que tocou cada arquivo para preencher o <lastmod>.
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler: ${{ env.BUNDLER_VERSION }}
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install build tools
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Minifica CSS/JS antes do build: o CSS entra inline no <head> de cada
      # página (via _includes/*.css) e os .js são servidos como arquivo. As
      # notas de legislação (/notas) têm CSS e JS próprios, minificados junto.
      # Roda só na produção; os previews do Netlify usam os fontes legíveis.
      - name: Minify CSS and JS
        run: |
          npx --no-install lightningcss --minify _includes/style.css -o /tmp/style.min.css
          mv /tmp/style.min.css _includes/style.css
          npx --no-install lightningcss --minify _includes/nota-style.css -o /tmp/nota-style.min.css
          mv /tmp/nota-style.min.css _includes/nota-style.css
          npx --no-install terser script.js --compress --mangle -o /tmp/script.min.js
          mv /tmp/script.min.js script.js
          npx --no-install terser notas.js --compress --mangle -o /tmp/notas.min.js
          mv /tmp/notas.min.js notas.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
