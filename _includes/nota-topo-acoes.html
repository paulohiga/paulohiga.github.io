{%- comment -%}
    Ações comuns a todas as páginas de /notas. A ordem é deliberada: buscar,
    consultar atalhos, alternar o tema. Manter o trio num único include evita
    que uma nova página da seção fique sem um dos controles ou use outra
    marcação acessível.
{%- endcomment -%}
        <div class="nota-topo__acoes">
            <a class="nota-busca" href="/notas/busca" aria-label="Buscar no acervo (tecla S)" aria-keyshortcuts="S" title="Buscar no acervo (S)">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            </a>
            <button id="nota-atalhos-btn" type="button" class="nota-atalhos-btn" aria-controls="nota-atalhos" aria-expanded="false" aria-label="Atalhos de teclado (tecla ?)" aria-keyshortcuts="?" title="Atalhos de teclado (?)">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
            </button>
            <button id="theme-toggle" type="button" class="nota-tema" aria-label="Alternar tema claro/escuro">
                <svg class="ico ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="ico ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </div>
