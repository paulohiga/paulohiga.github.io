{%- assign url_canonica = site.url | append: page.url -%}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} — Notas | Paulo Higa</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="author" content="Paulo Higa">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="{{ url_canonica }}">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Paulo Higa">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:url" content="{{ url_canonica }}">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:image" content="{{ site.url }}/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Paulo Higa">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.description }}">
    <meta name="twitter:image" content="{{ site.url }}/img/og-image.jpg">
    <meta name="twitter:image:alt" content="Paulo Higa">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- CSS próprio da seção, inline (mesma estratégia do restante do site e
         das notas individuais — ver nota-head.html). -->
    <style>{% include nota-style.css %}</style>

    <!-- DefinedTermSet: é o tipo que o schema.org tem para exatamente isto —
         um conjunto de termos definidos, cada um com nome, definição e o
         endereço em que está. Vale a repetição do texto no JSON-LD porque é o
         que permite a um buscador ou a um agente responder "o que a LGPD chama
         de operador?" citando a página, em vez de citar a nota inteira. A
         descrição vai cortada: o corpo do verbete já está no HTML. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DefinedTermSet",
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "inLanguage": "pt-BR",
      "url": "{{ url_canonica }}",
      "isAccessibleForFree": true,
      "author": {
        "@type": "Person",
        "name": "Paulo Higa",
        "url": "https://higa.me/"
      },
      "hasDefinedTerm": [
{%- assign primeiro = true -%}
{%- for arquivo in site.data.definicoes.verbetes -%}
{%- assign norma_slug = arquivo[0] -%}
{%- assign norma = site.leis | where: 'slug', norma_slug | first -%}
{%- for verbete in arquivo[1] %}
        {%- unless primeiro %},{% endunless %}{% assign primeiro = false %}
        {
          "@type": "DefinedTerm",
          "name": {{ verbete.termo | jsonify }},
          "description": {{ verbete.definicao | markdownify | strip_html | normalize_whitespace | strip | truncate: 300 | jsonify }},
          "inDefinedTermSet": "{{ url_canonica }}",
          "url": "{{ url_canonica }}#v-{{ norma.prefixo }}-{{ verbete.slug }}"
        }
{%- endfor -%}
{%- endfor %}
      ],
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "higa.me", "item": "https://higa.me/" },
          { "@type": "ListItem", "position": 2, "name": "Notas de legislação", "item": "https://higa.me/notas" },
          { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ url_canonica }}" }
        ]
      }
    }
    </script>

    <!-- Microsoft Clarity — loaded only after load + idle so it never competes
         with page content for network/CPU during loading (TBT). -->
    <script data-cfasync="false">
        (function () {
            function loadClarity() {
                (function(c,l,a,r,i,t,y){
                    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
                })(window, document, "clarity", "script", "x1sidv15u2");
            }
            window.addEventListener('load', function () {
                if ('requestIdleCallback' in window) requestIdleCallback(loadClarity, { timeout: 4000 });
                else setTimeout(loadClarity, 2000);
            });
        }());
    </script>
