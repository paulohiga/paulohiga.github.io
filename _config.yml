title: Paulo Higa
url: https://higa.me
encoding: utf-8

# Pages declare their own permalinks; no automatic per-collection prefixes.
permalink: pretty

# Notas de estudo sobre legislação (seção /notas, isolada do restante do site).
# `notas` são as páginas publicadas; `leis` guarda o texto legal em Markdown
# puro, renderizado dentro da nota que o cita — nunca como página própria;
# `fragmentos` são os HTML soltos (sem link algum) buscados via fetch(): as
# normas que não vêm pré-carregadas no HTML da nota (ver "Múltiplas normas por
# nota" em `docs/notas.md`) e a lista de verbetes que alimenta o balão dos
# termos definidos (ver "Definições legais", no mesmo documento).
#
# Ordem importa: Jekyll renderiza as coleções na ordem declarada aqui, e
# renderizar uma coleção reescreve o `.content` de cada documento dela para o
# HTML já convertido. `fragmentos` (como `notas`) precisa vir *antes* de
# `leis` — senão o `.content` que `lei-anotada.html` espera receber em
# Markdown puro já chegaria convertido em HTML pelo Kramdown padrão, sem as
# âncoras por dispositivo.
collections:
  notas:
    output: true
  fragmentos:
    output: true
  leis:
    output: false

# Plugins ativados no build via GitHub Actions (.github/workflows/pages.yml).
plugins:
  - jekyll-last-modified-at

# Formato da data de última modificação (usada no <lastmod> do sitemap.xml).
last_modified_at:
  date_format: "%Y-%m-%d"

# Arquivos que não são copiados para o site publicado. A régua: se não é
# alcançável por navegação humana, não tem por que responder numa URL — quem
# precisa deles (inclusive os agentes de IA) os lê no repositório. Vale para a
# documentação (README, AGENTS, CLAUDE, GEMINI, docs/) e para as ferramentas de
# autoria (scripts/, Gemfile), que antes eram servidas como arquivo estático.
#
# Os fragmentos de `_fragmentos/` são a exceção deliberada: precisam estar
# publicados, porque o painel "Lei seca" os busca via fetch(). Por isso ficam
# fora do sitemap (`sitemap: false`) e bloqueados no robots.txt.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - GEMINI.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - scripts
  - vendor

# Keep emitted markup intact (no HTML minification surprises).
keep_files:
  - img
